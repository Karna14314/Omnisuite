name: Deploy to Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      # Gate every Play deployment. This repository previously shipped with ci.yml renamed
      # to ci.yml.disabled and no quality step here at all, so any commit pushed to main was
      # built and uploaded to the Play internal track with no test and no lint run.
      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintRelease --no-daemon

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    
    env:
      VERSION_CODE_OFFSET: 2
      VERSION_PREFIX: '1.0'
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\""

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Compute Version Code and Name dynamically
      - name: Compute Version
        id: version
        env:
          OFFSET: ${{ env.VERSION_CODE_OFFSET }}
          RUN_NUM: ${{ github.run_number }}
          PREFIX: ${{ env.VERSION_PREFIX }}
        run: |
          OFFSET=${OFFSET:-2}
          RUN_NUM=${RUN_NUM:-1}
          PREFIX=${PREFIX:-1.0}
          
          BUILD_NUMBER=$(( RUN_NUM + OFFSET ))
          VERSION_NAME="${PREFIX}.${BUILD_NUMBER}"
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "APP_VERSION_CODE=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          echo "================================================"
          echo "Computed versionCode: $BUILD_NUMBER"
          echo "Computed versionName: $VERSION_NAME"
          echo "================================================"

      # 4. Generate Release Notes
      - name: Generate Release Notes
        id: generate-notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          
          cat > release_description.txt <<EOF
          Build: v${{ env.APP_VERSION_NAME }} (code ${{ env.APP_VERSION_CODE }})
          Date:  ${BUILD_DATE}
          Commit: ${COMMIT_HASH}
          
          ${COMMIT_MSG}
          EOF
          
          mkdir -p distribution/whatsnew
          cat > distribution/whatsnew/whatsnew-en-US <<EOF
          Welcome to OmniSuite — the all-in-one offline document & utility suite!
          • Complete PDF tools: edit, merge, split, compress, sign, and convert
          • Office viewers & converters for Word, Excel, PowerPoint, and CSV
          • Document scanner, on-device OCR text extractor, and QR/Barcode tools
          • Photo & Image Lab: resize, compress, and convert formats
          • 100% private & offline: zero tracking, no accounts, on-device processing
          EOF
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat distribution/whatsnew/whatsnew-en-US >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5. Decode Keystore from secrets
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cp keystore.jks app/keystore.jks
          echo "Keystore decoded successfully"

      # 6. Create Google Play JSON Key from secrets
      - name: Create Play Store JSON Key
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play-store-key.json

      # 7. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 8. Build Release AAB & APK
      - name: Build Release Bundle & APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: keystore.jks
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          CI: true
        run: |
          echo "Building AAB & APK — versionCode=${{ env.APP_VERSION_CODE }}, versionName=${{ env.APP_VERSION_NAME }}"
          ./gradlew bundleRelease assembleRelease \
            -PAPP_VERSION_CODE=${{ env.APP_VERSION_CODE }} \
            -PAPP_VERSION_NAME=${{ env.APP_VERSION_NAME }}

      # 9. Verify Build Output
      - name: Verify Build Outputs
        run: |
          echo "=== AAB Files ==="
          ls -lh app/build/outputs/bundle/release/
          test -f app/build/outputs/bundle/release/app-release.aab || { echo "ERROR: AAB build output missing"; exit 1; }
          echo "=== APK Files ==="
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk || { echo "ERROR: APK build output missing"; exit 1; }
          echo "=== Mapping File ==="
          ls -lh app/build/outputs/mapping/release/mapping.txt || echo "No mapping file found"

      # 10. Upload AAB as build artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnisuite-aab-v${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 10b. Upload APK as build artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnisuite-apk-v${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # 11. Deploy to Google Play Store (Internal Track)
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.karnadigital.omnisuite
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew

      # 12. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: "OmniSuite v${{ env.APP_VERSION_NAME }}"
          body: |
            ## OmniSuite v${{ env.APP_VERSION_NAME }} (Build ${{ env.APP_VERSION_CODE }})
            
            ### What's New
            ${{ steps.generate-notes.outputs.release_notes }}
            
            ### Deployment Status
            - Google Play Store: ✅ Deployed to Internal Testing Track
            
            ### Build Info
            - Version Code: ${{ env.APP_VERSION_CODE }}
            - Version Name: ${{ env.APP_VERSION_NAME }}
            - Min SDK: 30 (Android 11)
            - Target SDK: 36 (Android 16)
            - Build Number: ${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
