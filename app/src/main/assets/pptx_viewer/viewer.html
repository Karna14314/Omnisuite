<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.2, maximum-scale=4.0, user-scalable=yes">
    <link rel="stylesheet" href="pptxjs.css">
    <script src="jquery.min.js"></script>
    <script src="jszip.min.js"></script>
    <script src="filereader.js"></script>
    <script src="dingbat.js"></script>
    <script src="pptxjs.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1e1e1e; /* Dark slide stage */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #d1d5db;
            font-size: 14px;
            background: #1e1e1e;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #4b5563;
            border-top-color: #d24726; /* PowerPoint orange/red */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #error {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #f87171;
            font-size: 14px;
        }

        #pptx-container {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px 60px 8px;
        }

        /* Slide card styling */
        .slide {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45) !important;
            border-radius: 4px !important;
            margin: 12px auto !important;
            background-color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            transform-origin: top center;
        }

        /* Mode: PAGER (1 slide visible at a time) */
        body.mode-pager .slide {
            display: none !important;
        }
        body.mode-pager .slide.active-slide {
            display: block !important;
        }

        /* Mode: GRID (multi-column overview) */
        body.mode-grid #pptx-container {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
            gap: 16px !important;
            padding: 16px !important;
        }
        body.mode-grid .slide {
            width: 100% !important;
            height: auto !important;
            margin: 0 !important;
            cursor: pointer;
        }
        body.mode-grid .slide:hover, body.mode-grid .slide.active-slide {
            outline: 3px solid #d24726 !important;
        }

        /* Mode: SLIDESHOW (Full landscape presentation) */
        body.mode-slideshow {
            background: #000000 !important;
        }
        body.mode-slideshow #pptx-container {
            padding: 0 !important;
            justify-content: center;
        }
        body.mode-slideshow .slide {
            margin: 0 !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }
        body.mode-slideshow .slide:not(.active-slide) {
            display: none !important;
        }

        /* Search highlights */
        .search-highlight {
            background-color: #fef08a !important;
            color: #854d0e !important;
            border-radius: 2px !important;
            padding: 1px 2px !important;
        }
        .search-highlight-current {
            background-color: #f97316 !important;
            color: #ffffff !important;
            border-radius: 2px !important;
            padding: 1px 2px !important;
        }
    </style>
</head>
<body class="mode-pager">
    <div id="loading">
        <div class="spinner"></div>
        <span>Loading presentation…</span>
    </div>
    <div id="error"></div>
    <div id="pptx-container"></div>

    <script>
        var currentSlides = [];
        var activeSlideIndex = 0;
        var currentMode = 'PAGER'; // 'PAGER', 'GRID', 'SLIDESHOW'
        var searchMatches = [];
        var currentSearchIndex = -1;

        function renderPptxBase64(base64Data) {
            try {
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('error').style.display = 'none';

                var binaryString = atob(base64Data);
                var len = binaryString.length;
                var bytes = new Uint8Array(len);
                for (var i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                $("#pptx-container").empty();

                $("#pptx-container").pptxToHtml({
                    pptxArrayBuffer: bytes.buffer,
                    pptxFileUrl: "",
                    fileInput: null,
                    slidesScale: "",
                    slidePosition: "center",
                    keyBoardShortCut: false,
                    mediaProcess: true,
                    jsZipV2: false,
                    themeProcess: true
                });

                // Robust polling for PPTXjs to finish rendering slides
                var checkCount = 0;
                var checkInterval = setInterval(function() {
                    checkCount++;
                    var slides = document.querySelectorAll('#pptx-container .slide, #pptx-container > section, #pptx-container > div:not(.slides-loadnig-msg)');
                    if (slides.length > 0 || checkCount > 30) {
                        clearInterval(checkInterval);
                        initSlides();
                    }
                }, 200);

            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'PPTX render error: ' + e.message;
                console.error('PPTX error:', e);
            }
        }

        function initSlides() {
            var slides = document.querySelectorAll('#pptx-container .slide, #pptx-container > section, #pptx-container > div:not(.slides-loadnig-msg)');
            if (!slides || slides.length === 0) {
                // Fallback: check all direct child div/sections
                slides = document.querySelectorAll('#pptx-container > div, #pptx-container > section');
            }

            currentSlides = Array.from(slides);
            document.getElementById('loading').style.display = 'none';

            if (currentSlides.length > 0) {
                currentSlides.forEach(function(slide, idx) {
                    slide.classList.add('slide');
                    slide.setAttribute('data-slide-index', idx);
                    slide.addEventListener('click', function() {
                        if (currentMode === 'GRID') {
                            setViewMode('PAGER');
                            goToSlide(idx);
                        }
                    });
                });

                goToSlide(0);

                if (window.AndroidBridge) {
                    window.AndroidBridge.onRenderComplete(currentSlides.length);
                }
            } else {
                // In case PPTXjs rendered with different classes
                var wrapper = document.getElementById('pptx-container');
                if (wrapper.children.length > 0) {
                    currentSlides = Array.from(wrapper.children);
                    goToSlide(0);
                    if (window.AndroidBridge) {
                        window.AndroidBridge.onRenderComplete(currentSlides.length);
                    }
                }
            }
            fitSlideScale();
        }

        function goToSlide(index) {
            if (currentSlides.length === 0) return;
            index = Math.max(0, Math.min(index, currentSlides.length - 1));
            activeSlideIndex = index;

            currentSlides.forEach(function(slide, idx) {
                if (idx === index) {
                    slide.classList.add('active-slide');
                } else {
                    slide.classList.remove('active-slide');
                }
            });

            fitSlideScale();

            if (window.AndroidBridge) {
                window.AndroidBridge.onSlideChanged(activeSlideIndex, currentSlides.length);
            }
        }

        function nextSlide() {
            if (activeSlideIndex < currentSlides.length - 1) {
                goToSlide(activeSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (activeSlideIndex > 0) {
                goToSlide(activeSlideIndex - 1);
            }
        }

        function setViewMode(mode) {
            currentMode = mode;
            document.body.className = 'mode-' + mode.toLowerCase();
            fitSlideScale();
        }

        function fitSlideScale() {
            if (currentMode === 'GRID') {
                currentSlides.forEach(function(s) { s.style.transform = 'none'; });
                return;
            }

            var viewportWidth = window.innerWidth - 32;
            var viewportHeight = window.innerHeight - 80;

            if (currentMode === 'SLIDESHOW') {
                viewportWidth = window.innerWidth;
                viewportHeight = window.innerHeight;
            }

            var active = document.querySelector('.slide.active-slide');
            if (active) {
                var naturalWidth = active.offsetWidth || 960;
                var naturalHeight = active.offsetHeight || 540;

                if (naturalWidth > 0 && naturalHeight > 0) {
                    var scaleX = viewportWidth / naturalWidth;
                    var scaleY = viewportHeight / naturalHeight;
                    var scale = Math.min(scaleX, scaleY, 1.2);
                    active.style.transform = 'scale(' + scale + ')';
                }
            }
        }

        // Swipe gesture support for pager mode
        var touchStartX = 0;
        var touchEndX = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (currentMode === 'PAGER' || currentMode === 'SLIDESHOW') {
                var diff = touchEndX - touchStartX;
                if (diff < -50) {
                    nextSlide(); // Swiped left -> next slide
                } else if (diff > 50) {
                    prevSlide(); // Swiped right -> prev slide
                }
            }
        }, { passive: true });

        window.addEventListener('resize', fitSlideScale);
    </script>
</body>
</html>
