<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="xspreadsheet.css">
    <script src="xlsx.full.min.js"></script>
    <script src="xspreadsheet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        #xspreadsheet {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Loading indicator */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #5f6368;
            font-size: 14px;
            background: #ffffff;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #dadce0;
            border-top-color: #107c41; /* Excel green */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #error {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #d93025;
            font-size: 14px;
        }

        /* Mobile styling for x-spreadsheet toolbar and bottom tabs */
        .x-spreadsheet-toolbar {
            display: none !important;
        }
        .x-spreadsheet-bottombar {
            height: 38px !important;
            background: #f3f3f3 !important;
            border-top: 1px solid #e0e0e0 !important;
        }
        .x-spreadsheet-bottombar .x-spreadsheet-menu li {
            font-size: 13px !important;
            padding: 6px 14px !important;
            border-radius: 4px 4px 0 0 !important;
        }
        .x-spreadsheet-bottombar .x-spreadsheet-menu li.active {
            background: #ffffff !important;
            color: #107c41 !important;
            font-weight: 600 !important;
            border-bottom: 2px solid #107c41 !important;
        }

        /* Viewport container for uniform zoom */
        #xspreadsheet-viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #xspreadsheet {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        /* Floating in-place charts & images strictly bounded to cells */
        #charts-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }
        .floating-visual-item {
            position: absolute;
            pointer-events: auto;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: none;
            touch-action: none;
        }
        .floating-visual-item.selected {
            border: 2px solid #107c41;
            box-shadow: 0 4px 12px rgba(16, 124, 65, 0.25);
        }
        .floating-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid #e0e0e0;
            background: #f9fbf9;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
            height: 27px;
        }
        .floating-chart-title {
            font-size: 12px;
            font-weight: bold;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .floating-chart-badge {
            font-size: 9px;
            font-weight: bold;
            background: #e8f5e9;
            color: #107c41;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-left: 6px;
        }
        .floating-visual-content {
            width: 100%;
            height: calc(100% - 27px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .floating-visual-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* Selection handles for resize - positioned at corners and edges */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #107c41;
            border: 2px solid #ffffff;
            border-radius: 2px;
            pointer-events: auto;
            z-index: 20;
            display: none;
        }
        .floating-visual-item.selected .resize-handle {
            display: block;
        }
        .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
        .resize-handle.n { top: -6px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .resize-handle.s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .resize-handle.w { top: 50%; left: -6px; transform: translateY(-50%); cursor: w-resize; }
        .resize-handle.e { top: 50%; right: -6px; transform: translateY(-50%); cursor: e-resize; }

        /* Floating Zoom Controls Pill */
        #zoom-controls {
            position: fixed;
            bottom: 46px;
            right: 12px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #dadce0;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            padding: 2px 6px;
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
        }
        .zoom-btn {
            background: transparent;
            border: none;
            color: #107c41;
            font-size: 16px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
        }
        .zoom-btn:active {
            background: #e8f5e9;
        }
        #zoom-label {
            font-size: 11px;
            font-weight: 600;
            color: #374151;
            padding: 0 4px;
            min-width: 36px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Opening spreadsheet…</span>
    </div>
    <div id="error"></div>
    <div id="xspreadsheet-viewport">
        <div id="xspreadsheet"></div>
    </div>

    <div id="charts-overlay"></div>

    <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomOut()">−</button>
        <span id="zoom-label" onclick="resetZoom()">100%</span>
        <button class="zoom-btn" onclick="zoomIn()">+</button>
    </div>

    <script>
        var xs = null;
        var currentWorkbook = null;
        var currentSheetIndex = 0;
        var searchMatches = [];
        var currentSearchIndex = -1;
        var currentScale = 1.0;
        var allSheetCharts = [];
        var allSheetImages = [];

        /**
         * Convert font size from points (pt) to pixels (px).
         * 1pt = 1.33px (at 96dpi). x-spreadsheet expects px.
         */
        function ptToPx(pt) {
            return Math.round((pt || 10) * 4 / 3);
        }

        /**
         * Generate clean, vector SVG markup for spreadsheet charts
         */
        function generateChartSvg(chart, width, height) {
            var type = (chart.chartType || 'BAR').toUpperCase();
            if (type === 'UNKNOWN') type = 'BAR';
            var title = chart.title || 'Spreadsheet Chart';
            var values = [45, 80, 60, 95, 70];
            var labels = ['Login', 'Admin', 'Payment', 'Profile', 'Settings'];
            if (chart.series && chart.series.length > 0 && chart.series[0].values && chart.series[0].values.length > 0) {
                values = chart.series[0].values;
                labels = chart.series[0].labels || labels;
            }
            var colors = ['#107C41', '#4285F4', '#FBBC04', '#EA4335', '#9C27B0', '#009688'];

            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">';
            svg += '<rect width="100%" height="100%" fill="#ffffff" rx="6" stroke="#d0d7de" stroke-width="1.5"/>';
            svg += '<text x="14" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">' + title + '</text>';
            svg += '<rect x="' + (width - 64) + '" y="12" width="50" height="16" rx="3" fill="#e8f5e9"/>';
            svg += '<text x="' + (width - 39) + '" y="24" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#107c41" text-anchor="middle">' + type + '</text>';
            svg += '<line x1="12" y1="34" x2="' + (width - 12) + '" y2="34" stroke="#e0e0e0" stroke-width="1"/>';

            if (type === 'PIE') {
                var total = values.reduce(function(a, b) { return a + b; }, 0) || 1;
                var startAngle = 0;
                var cx = width / 2, cy = height / 2 + 10, r = Math.min(width, height) / 3.2;
                values.forEach(function(val, vIdx) {
                    var sliceAngle = (val / total) * 2 * Math.PI;
                    var x1 = cx + r * Math.sin(startAngle);
                    var y1 = cy - r * Math.cos(startAngle);
                    var x2 = cx + r * Math.sin(startAngle + sliceAngle);
                    var y2 = cy - r * Math.cos(startAngle + sliceAngle);
                    var largeArc = sliceAngle > Math.PI ? 1 : 0;
                    var pathData = 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' Z';
                    svg += '<path d="' + pathData + '" fill="' + colors[vIdx % colors.length] + '"/>';
                    startAngle += sliceAngle;
                });
            } else {
                var maxVal = Math.max.apply(null, values) || 100;
                var count = Math.min(values.length, 6);
                var barW = (width - 60) / count - 12;
                var startX = 30;
                values.slice(0, count).forEach(function(val, vIdx) {
                    var bH = Math.max((val / maxVal) * (height - 80), 8);
                    var bx = startX + vIdx * (barW + 12);
                    var by = height - 30 - bH;
                    svg += '<rect x="' + bx + '" y="' + by + '" width="' + barW + '" height="' + bH + '" rx="3" fill="' + colors[vIdx % colors.length] + '"/>';
                    svg += '<text x="' + (bx + barW / 2) + '" y="' + (by - 4) + '" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="' + colors[vIdx % colors.length] + '" text-anchor="middle">' + Math.round(val) + '</text>';
                    var lbl = (labels[vIdx] || ('Item ' + (vIdx + 1))).substring(0, 7);
                    svg += '<text x="' + (bx + barW / 2) + '" y="' + (height - 14) + '" font-family="Arial, sans-serif" font-size="9" fill="#555555" text-anchor="middle">' + lbl + '</text>';
                });
            }
            svg += '</svg>';
            return svg;
        }

        /**
         * Create a floating overlay element for a chart or image.
         * Positioned absolutely based on cell coordinates from x-spreadsheet data.
         */
        function createFloatingVisual(itemData) {
            var overlay = document.getElementById('charts-overlay');
            if (!overlay || !xs || !xs.datas || !xs.datas[currentSheetIndex]) return null;

            var d = xs.datas[currentSheetIndex];
            var indexW = d.cols.indexWidth || 42;
            var headerH = d.rows.height || 26;

            // Calculate pixel position from cell coordinates
            var cellX = indexW + d.cols.sumWidth(0, itemData.fromCol) - d.scroll.x;
            var cellY = headerH + d.rows.sumHeight(0, itemData.fromRow) - d.scroll.y;

            // Calculate size from cell spans
            var cellW = 0;
            for (var c = itemData.fromCol; c < itemData.fromCol + itemData.colSpan; c++) {
                cellW += d.cols.getWidth(c);
            }
            var cellH = 0;
            for (var r = itemData.fromRow; r < itemData.fromRow + itemData.rowSpan; r++) {
                cellH += d.rows.getHeight(r);
            }

            // Apply scale
            var dispX = cellX * currentScale;
            var dispY = cellY * currentScale;
            var dispW = cellW * currentScale;
            var dispH = cellH * currentScale;

            // Minimum display sizes
            dispW = Math.max(dispW, 200 * currentScale);
            dispH = Math.max(dispH, 150 * currentScale);

            var el = document.createElement('div');
            el.className = 'floating-visual-item';
            el.style.left = dispX + 'px';
            el.style.top = dispY + 'px';
            el.style.width = dispW + 'px';
            el.style.height = dispH + 'px';
            el.style.display = 'block';
            el.dataset.sheetIndex = currentSheetIndex;
            el.dataset.fromRow = itemData.fromRow;
            el.dataset.fromCol = itemData.fromCol;
            el.dataset.rowSpan = itemData.rowSpan;
            el.dataset.colSpan = itemData.colSpan;

            // Header bar (drag handle for moving)
            var header = document.createElement('div');
            header.className = 'floating-chart-header';
            var titleSpan = document.createElement('span');
            titleSpan.className = 'floating-chart-title';
            titleSpan.textContent = itemData.title || 'Chart';
            var badgeSpan = document.createElement('span');
            badgeSpan.className = 'floating-chart-badge';
            badgeSpan.textContent = itemData.badge || 'CHART';
            header.appendChild(titleSpan);
            header.appendChild(badgeSpan);
            el.appendChild(header);

            // Content area
            var content = document.createElement('div');
            content.className = 'floating-visual-content';
            if (itemData.imgSrc) {
                var img = document.createElement('img');
                img.src = itemData.imgSrc;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain';
                content.appendChild(img);
            }
            el.appendChild(content);

            // Resize handles at corners and edges (properly positioned flush with edges)
            var handlePositions = ['nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'];
            handlePositions.forEach(function(pos) {
                var handle = document.createElement('div');
                handle.className = 'resize-handle ' + pos;
                handle.dataset.handle = pos;
                el.appendChild(handle);
            });

            overlay.appendChild(el);

            // Attach interaction handlers
            attachFloatingItemHandlers(el);

            return el;
        }

        /**
         * Attach drag-to-move and resize handlers to a floating visual item.
         * Handles are positioned flush with the item edges/corners.
         */
        function attachFloatingItemHandlers(el) {
            var header = el.querySelector('.floating-chart-header');
            var isDragging = false;
            var isResizing = false;
            var dragOffsetX = 0, dragOffsetY = 0;
            var resizeHandle = null;
            var resizeStartX = 0, resizeStartY = 0;
            var resizeStartW = 0, resizeStartH = 0, resizeStartLeft = 0, resizeStartTop = 0;

            // Move via header drag
            header.addEventListener('touchstart', function(e) {
                if (e.target.classList.contains('resize-handle')) return;
                var touch = e.touches[0];
                isDragging = true;
                selectFloatingItem(el);
                var rect = el.getBoundingClientRect();
                dragOffsetX = touch.clientX - rect.left;
                dragOffsetY = touch.clientY - rect.top;
                e.preventDefault();
            }, { passive: false });

            // Resize via handle touch
            var handles = el.querySelectorAll('.resize-handle');
            handles.forEach(function(handle) {
                handle.addEventListener('touchstart', function(e) {
                    var touch = e.touches[0];
                    isResizing = true;
                    resizeHandle = handle.dataset.handle;
                    resizeStartX = touch.clientX;
                    resizeStartY = touch.clientY;
                    var rect = el.getBoundingClientRect();
                    resizeStartW = rect.width;
                    resizeStartH = rect.height;
                    resizeStartLeft = rect.left;
                    resizeStartTop = rect.top;
                    selectFloatingItem(el);
                    e.preventDefault();
                    e.stopPropagation();
                }, { passive: false });
            });

            // Single tap to select (not drag)
            el.addEventListener('touchstart', function(e) {
                if (e.target.classList.contains('resize-handle') || e.target.closest('.floating-chart-header')) return;
                selectFloatingItem(el);
            }, { passive: true });
        }

        /**
         * Select a floating item (show handles) and deselect others.
         */
        function selectFloatingItem(el) {
            var allItems = document.querySelectorAll('.floating-visual-item.selected');
            allItems.forEach(function(item) {
                if (item !== el) item.classList.remove('selected');
            });
            el.classList.add('selected');
        }

        /**
         * Deselect all floating items.
         */
        function deselectAllFloatingItems() {
            var allItems = document.querySelectorAll('.floating-visual-item.selected');
            allItems.forEach(function(item) {
                item.classList.remove('selected');
            });
        }

        // Global touch move/end for floating item drag and resize
        var activeDragItem = null;
        var activeDragOffsetX = 0, activeDragOffsetY = 0;
        var activeResizeItem = null;
        var activeResizeHandle = '';
        var activeResizeStartX = 0, activeResizeStartY = 0;
        var activeResizeStartW = 0, activeResizeStartH = 0, activeResizeStartLeft = 0, activeResizeStartTop = 0;

        document.addEventListener('touchstart', function(e) {
            // Check if touching a floating item header (move) or handle (resize)
            var target = e.target;
            var floatingItem = target.closest('.floating-visual-item');
            if (floatingItem) {
                selectFloatingItem(floatingItem);
                if (target.classList.contains('resize-handle')) {
                    var touch = e.touches[0];
                    activeResizeItem = floatingItem;
                    activeResizeHandle = target.dataset.handle;
                    activeResizeStartX = touch.clientX;
                    activeResizeStartY = touch.clientY;
                    var rect = floatingItem.getBoundingClientRect();
                    activeResizeStartW = rect.width;
                    activeResizeStartH = rect.height;
                    activeResizeStartLeft = rect.left;
                    activeResizeStartTop = rect.top;
                } else if (target.closest('.floating-chart-header')) {
                    var touch = e.touches[0];
                    activeDragItem = floatingItem;
                    var rect = floatingItem.getBoundingClientRect();
                    activeDragOffsetX = touch.clientX - rect.left;
                    activeDragOffsetY = touch.clientY - rect.top;
                }
            } else if (!target.closest('#zoom-controls') && !target.closest('.x-spreadsheet-bottombar')) {
                // Deselect when tapping empty space
                deselectAllFloatingItems();
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (activeDragItem && e.touches.length === 1) {
                var touch = e.touches[0];
                var overlay = document.getElementById('charts-overlay');
                var overlayRect = overlay ? overlay.getBoundingClientRect() : { left: 0, top: 0 };
                var newX = (touch.clientX - overlayRect.left - activeDragOffsetX) / currentScale;
                var newY = (touch.clientY - overlayRect.top - activeDragOffsetY) / currentScale;
                activeDragItem.style.left = (newX * currentScale) + 'px';
                activeDragItem.style.top = (newY * currentScale) + 'px';
                e.preventDefault();
            }
            if (activeResizeItem && e.touches.length === 1) {
                var touch = e.touches[0];
                var dx = (touch.clientX - activeResizeStartX) / currentScale;
                var dy = (touch.clientY - activeResizeStartY) / currentScale;
                var minSize = 40;
                var newW = activeResizeStartW, newH = activeResizeStartH;
                var newLeft = activeResizeStartLeft, newTop = activeResizeStartTop;

                var handle = activeResizeHandle;
                if (handle.indexOf('e') !== -1) {
                    newW = Math.max(minSize, activeResizeStartW + dx);
                }
                if (handle.indexOf('w') !== -1) {
                    var wDelta = Math.min(dx, activeResizeStartW - minSize);
                    newW = activeResizeStartW - wDelta;
                    newLeft = activeResizeStartLeft + wDelta;
                }
                if (handle.indexOf('s') !== -1) {
                    newH = Math.max(minSize, activeResizeStartH + dy);
                }
                if (handle.indexOf('n') !== -1) {
                    var hDelta = Math.min(dy, activeResizeStartH - minSize);
                    newH = activeResizeStartH - hDelta;
                    newTop = activeResizeStartTop + hDelta;
                }

                var overlay = document.getElementById('charts-overlay');
                var overlayRect = overlay ? overlay.getBoundingClientRect() : { left: 0, top: 0 };
                activeResizeItem.style.width = (newW) + 'px';
                activeResizeItem.style.height = (newH) + 'px';
                if (handle.indexOf('w') !== -1 || handle.indexOf('n') !== -1) {
                    activeResizeItem.style.left = ((newLeft - overlayRect.left) / currentScale) * currentScale + 'px';
                    activeResizeItem.style.top = ((newTop - overlayRect.top) / currentScale) * currentScale + 'px';
                }
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            activeDragItem = null;
            activeResizeItem = null;
            activeResizeHandle = '';
        });

        /**
         * Reposition all floating visual items based on current scroll/zoom.
         * Called after spreadsheet renders or zoom changes.
         */
        function repositionFloatingVisuals() {
            if (!xs || !xs.datas || !xs.datas[currentSheetIndex]) return;
            var d = xs.datas[currentSheetIndex];
            var indexW = d.cols.indexWidth || 42;
            var headerH = d.rows.height || 26;
            var overlay = document.getElementById('charts-overlay');
            if (!overlay) return;

            var items = overlay.querySelectorAll('.floating-visual-item');
            items.forEach(function(el) {
                var fromRow = parseInt(el.dataset.fromRow);
                var fromCol = parseInt(el.dataset.fromCol);
                var colSpan = parseInt(el.dataset.colSpan);
                var rowSpan = parseInt(el.dataset.rowSpan);

                var cellX = indexW + d.cols.sumWidth(0, fromCol) - d.scroll.x;
                var cellY = headerH + d.rows.sumHeight(0, fromRow) - d.scroll.y;
                el.style.left = (cellX * currentScale) + 'px';
                el.style.top = (cellY * currentScale) + 'px';
            });
        }

        /**
         * Clear all floating visual items from the overlay.
         */
        function clearFloatingVisuals() {
            var overlay = document.getElementById('charts-overlay');
            if (overlay) overlay.innerHTML = '';
        }

        /**
         * Render full workbook from POI-extracted JSON structure with complete font formatting,
         * colors, merged cells, and column dimensions.
         */
        function renderSpreadsheetData(jsonData, base64Fallback) {
            try {
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('error').style.display = 'none';

                var wbData = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                if (!wbData || !wbData.sheets || wbData.sheets.length === 0) {
                    if (base64Fallback) {
                        renderSpreadsheetBase64(base64Fallback);
                    }
                    return;
                }

                var xData = [];
                allSheetCharts = [];
                allSheetImages = [];

                wbData.sheets.forEach(function(sheet, sIdx) {
                    var sheetObj = {
                        name: sheet.name || ('Sheet' + (sIdx + 1)),
                        rows: {},
                        cols: {},
                        styles: [],
                        merges: []
                    };

                    var styleMap = {};
                    function getStyleIdx(cell) {
                        var bg = cell.bgColor ? (cell.bgColor.startsWith('#') ? cell.bgColor : ('#' + cell.bgColor)) : '';
                        var fg = cell.textColor ? (cell.textColor.startsWith('#') ? cell.textColor : ('#' + cell.textColor)) : '';
                        var align = (cell.align || 'LEFT').toLowerCase();
                        var fontSizePx = ptToPx(cell.fontSize || 10);
                        var key = (cell.bold ? 'B' : '') + '_' + (cell.italic ? 'I' : '') + '_' + (cell.underline ? 'U' : '') + '_' + fontSizePx + '_' + bg + '_' + fg + '_' + align;
                        
                        if (styleMap[key] !== undefined) return styleMap[key];

                        var st = {
                            font: {
                                name: 'Arial',
                                size: fontSizePx,
                                bold: !!cell.bold,
                                italic: !!cell.italic
                            },
                            underline: !!cell.underline,
                            align: align,
                            valign: 'top',
                            textwrap: true
                        };
                        if (bg) st.bgcolor = bg;

                                    var isActive = window.activeSearchMatch && window.activeSearchMatch.r === m.r && window.activeSearchMatch.c === m.c;
                                    var cellX = indexW + d.cols.sumWidth(0, m.c) - scrollX;
                                    var cellY = headerH + d.rows.sumHeight(0, m.r) - scrollY;
                                    var cellW = d.cols.getWidth(m.c);
                                    var cellH = d.rows.getHeight(m.r);
                                    if (cellX + cellW < indexW || cellY + cellH < headerH) return;
                                    if (cellX > canvas.width || cellY > canvas.height) return;

                                    if (isActive) {

                                        ctx.fillRect(cellX, cellY, cellW, cellH);
                                        ctx.strokeStyle = "rgba(255,152,0,0.9)";
                                        ctx.lineWidth = 2;
                                        ctx.strokeRect(cellX + 1, cellY + 1, cellW - 2, cellH - 2);

                                        ctx.fillStyle = "rgba(255,235,59,0.35)";
                                        ctx.fillRect(cellX, cellY, cellW, cellH);
                                        ctx.strokeStyle = "rgba(255,193,7,0.8)";
                                        ctx.lineWidth = 1.5;
                                        ctx.strokeRect(cellX + 1, cellY + 1, cellW - 2, cellH - 2);
                                    }

                            var vr = d.viewRange();
                            d.colEach(vr.sci, vr.eci, function(cIdx) {
                                var colW = d.cols.getWidth(cIdx);

        /**

        function renderSpreadsheetBase64(base64Data) {

                    }
                });

                document.getElementById('loading').style.display = 'none';

                if (window.AndroidBridge) {
                    window.AndroidBridge.onRenderComplete(currentWorkbook.SheetNames.length);
                }
            } catch (e) {

        function stox(wb) {
            var out = [];
            wb.SheetNames.forEach(function(name) {
                var o = { name: name, rows: {}, styles: [], merges: [] };
                var ws = wb.Sheets[name];
                if (!ws || !ws['!ref']) {
                    out.push(o);
                    return;
                }
                var range = XLSX.utils.decode_range(ws['!ref']);

                var mergeMap = {};
                if (ws['!merges'] && ws['!merges'].length > 0) {
                    ws['!merges'].forEach(function(m) {
                        o.merges.push(XLSX.utils.encode_range(m));
                        var rDiff = m.e.r - m.s.r;
                        var cDiff = m.e.c - m.s.c;
                        mergeMap[m.s.r + '_' + m.s.c] = [rDiff, cDiff];
                    });
                }

                if (ws['!cols']) {
                    o.cols = {};
                    ws['!cols'].forEach(function(colInfo, cIdx) {
                        if (colInfo && colInfo.wpx) {
                            o.cols[cIdx] = { width: colInfo.wpx };
                        } else if (colInfo && colInfo.wch) {
                            o.cols[cIdx] = { width: Math.max(colInfo.wch * 8, 60) };
                        }
                    });
                }

                // Build a style map for font formatting from cell metadata
                var styleMap = {};
                function getStyleIdx(cell) {
                    var bg = '', fg = '', align = 'left';
                    var bold = false, italic = false, underline = false;
                    var fontSizePx = 13; // default ~10pt
                    if (cell.s && typeof cell.s === 'object') {
                        if (cell.s.fill && cell.s.fill.fgColor && cell.s.fill.fgColor.rgb) {
                            bg = '#' + cell.s.fill.fgColor.rgb.substring(2);
                        }
                        if (cell.s.font) {
                            bold = !!cell.s.font.bold;
                            italic = !!cell.s.font.italic;
                            underline = !!cell.s.font.underline;
                            if (cell.s.font.sz) fontSizePx = ptToPx(cell.s.font.sz);
                            if (cell.s.font.color && cell.s.font.color.rgb) fg = '#' + cell.s.font.color.rgb.substring(2);
                            if (cell.s.font.name) { /* font family captured but x-spreadsheet uses Arial */ }
                        }
                        if (cell.s.alignment && cell.s.alignment.horizontal) {
                            align = cell.s.alignment.horizontal.toLowerCase();
                        }
                    }
                    var key = (bold ? 'B' : '') + '_' + (italic ? 'I' : '') + '_' + (underline ? 'U' : '') + '_' + fontSizePx + '_' + bg + '_' + fg + '_' + align;
                    if (styleMap[key] !== undefined) return styleMap[key];
                    var st = {
                        font: { name: 'Arial', size: fontSizePx, bold: bold, italic: italic },
                        underline: underline,
                        align: align,
                        valign: 'top',
                        textwrap: true
                    };
                    if (bg) st.bgcolor = bg;
                    if (fg) st.color = fg;
                    o.styles.push(st);
                    var idx = o.styles.length - 1;
                    styleMap[key] = idx;
                    return idx;
                }

                for (var R = range.s.r; R <= range.e.r; ++R) {
                    o.rows[R] = { cells: {} };
                    for (var C = range.s.c; C <= range.e.c; ++C) {
                        var cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        var cell = ws[cellAddress];
                        if (!cell) continue;

                        var cellData = {
                            text: cell.w !== undefined ? String(cell.w) : (cell.v !== undefined ? String(cell.v) : "")
                        };

                        if (cell.f) {
                            cellData.f = "=" + cell.f;
                        }

                        var mKey = R + '_' + C;
                        if (mergeMap[mKey]) {
                            cellData.merge = mergeMap[mKey];
                        }

                        // Apply font styling from cell style
                        if (cell.s !== undefined) {
                            cellData.style = getStyleIdx(cell);
                        }

                        o.rows[R].cells[C] = cellData;
                    }
                }
                out.push(o);
            });
            return out;
        }

        /**
         * Zoom Engine: Clean proportional viewport zoom (35% to 200%)
         * Scales fonts, cells, borders, and visual items in exact mathematical ratio.
         */
        function updateZoom(newScale) {
            currentScale = Math.min(Math.max(newScale, 0.35), 2.5);
            document.getElementById('zoom-label').textContent = Math.round(currentScale * 100) + '%';
            
            var container = document.getElementById('xspreadsheet');
            if (container) {
                var invScale = 1.0 / currentScale;
                var targetW = Math.round(window.innerWidth * invScale);
                var targetH = Math.round(window.innerHeight * invScale);
                
                container.style.width = targetW + 'px';
                container.style.height = targetH + 'px';
                container.style.transform = 'scale(' + currentScale + ')';
                container.style.transformOrigin = '0 0';
            }

            if (xs && xs.sheet) {
                xs.sheet.reload();
            }

            // Reposition floating visuals after zoom
            repositionFloatingVisuals();

                    e.touches[0].pageY - e.touches[1].pageY

            if (!xs || !xs.datas || !xs.datas[currentSheetIndex]) return;
            var d = xs.datas[currentSheetIndex];
            var rIdx = parseInt(r) || 0;
            var cIdx = parseInt(c) || 0;
            
            d.selector.setIndexes(rIdx, cIdx);
            d.selector.range.set(rIdx, cIdx, rIdx, cIdx);
            
            var cellX = d.cols.sumWidth(0, cIdx);
            var cellY = d.rows.sumHeight(0, rIdx);
            var cellW = d.cols.getWidth(cIdx);
            var cellH = d.rows.getHeight(rIdx);

            var viewW = window.innerWidth / currentScale;
            var viewH = window.innerHeight / currentScale;

            var targetScrollX = Math.max(0, Math.round(cellX - (viewW / 2) + (cellW / 2)));
            var targetScrollY = Math.max(0, Math.round(cellY - (viewH / 2) + (cellH / 2)));

            d.scroll.x = targetScrollX;
            d.scroll.y = targetScrollY;

            if (xs.sheet.verticalScrollbar) xs.sheet.verticalScrollbar.move({ top: targetScrollY });
            if (xs.sheet.horizontalScrollbar) xs.sheet.horizontalScrollbar.move({ left: targetScrollX });

            window.activeSearchMatch = { r: rIdx, c: cIdx };
            if (xs.sheet.table) xs.sheet.table.render();

            var cell = d.rows.getCell(rIdx, cIdx);
            var text = cell ? (cell.text || '') : '';
            var formula = cell && cell.f ? cell.f : '';
            if (window.AndroidBridge) {
                window.AndroidBridge.onCellSelected(currentSheetIndex, rIdx, cIdx, text, formula);
            }
        }

        function searchSpreadsheet(query) {
            searchMatches = [];
            currentSearchIndex = -1;
            window.allSearchMatches = [];
            window.activeSearchMatch = null;

            if (!query || query.trim() === '') {
                if (xs && xs.sheet) xs.sheet.reload();
                return 0;
            }
            var lower = query.toLowerCase();

            if (xs && xs.datas && xs.datas[currentSheetIndex]) {
                var d = xs.datas[currentSheetIndex];
                d.rows.each(function(rIdx, row) {
                    if (row && row.cells) {
                        Object.keys(row.cells).forEach(function(cIdx) {
                            var c = row.cells[cIdx];
                            if (c && c.text && c.text.toLowerCase().indexOf(lower) !== -1) {
                                searchMatches.push({ r: parseInt(rIdx), c: parseInt(cIdx) });
                            }
                        });
                    }
                });
            }

            window.allSearchMatches = searchMatches;

            if (searchMatches.length > 0) {
                currentSearchIndex = 0;
                highlightSearchMatch(0);
            } else if (xs && xs.sheet) {
                xs.sheet.reload();
            }
            return searchMatches.length;
        }

        function highlightSearchMatch(index) {
            if (!xs || index < 0 || index >= searchMatches.length) return;
            var match = searchMatches[index];
            window.activeSearchMatch = match;
            window.allSearchMatches = searchMatches;

            var d = xs.datas[currentSheetIndex];
            if (d) {
                d.selector.setIndexes(match.r, match.c);
                d.selector.range.set(match.r, match.c, match.r, match.c);

                var cellX = d.cols.sumWidth(0, match.c);
                var cellY = d.rows.sumHeight(0, match.r);
                var cellW = d.cols.getWidth(match.c);
                var cellH = d.rows.getHeight(match.r);

                var viewW = window.innerWidth / currentScale;
                var viewH = window.innerHeight / currentScale;

                var targetScrollX = Math.max(0, Math.round(cellX - (viewW / 2) + (cellW / 2)));
                var targetScrollY = Math.max(0, Math.round(cellY - (viewH / 2) + (cellH / 2)));

                d.scroll.x = targetScrollX;
                d.scroll.y = targetScrollY;

                if (xs.sheet.verticalScrollbar) xs.sheet.verticalScrollbar.move({ top: targetScrollY });
                if (xs.sheet.horizontalScrollbar) xs.sheet.horizontalScrollbar.move({ left: targetScrollX });
                if (xs.sheet.table) xs.sheet.table.render();
            }

            if (window.AndroidBridge) {
                var cell = d ? d.rows.getCell(match.r, match.c) : null;
                window.AndroidBridge.onCellSelected(currentSheetIndex, match.r, match.c, cell ? (cell.text || '') : '', cell && cell.f ? cell.f : '');
            }
        }

        function nextSearchMatch() {
            if (searchMatches.length === 0) return -1;
            currentSearchIndex = (currentSearchIndex + 1) % searchMatches.length;
            highlightSearchMatch(currentSearchIndex);
            return currentSearchIndex;
        }

        function prevSearchMatch() {
            if (searchMatches.length === 0) return -1;
            currentSearchIndex = (currentSearchIndex - 1 + searchMatches.length) % searchMatches.length;
            highlightSearchMatch(currentSearchIndex);
            return currentSearchIndex;
        }

        window.addEventListener('resize', function() {
            if (xs) {
                xs.reRender();
            }
        });
    </script>
</body>
</html>
