# Allocate healthy memory budget to prevent Java heap space errors during kapt, R8 minification, and code compilation
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX
android.useAndroidX=true

# Jetifier is not needed as this codebase uses modern AndroidX natively
android.enableJetifier=false

# Suppress compile SDK target mismatch warnings
android.suppressUnsupportedCompileSdk=36
